<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schul-Dashboard & Cloud-Manager</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { background-color: #0b0f17; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card:hover { border-color: rgba(59, 130, 246, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-12">

  <!-- HEADER -->
  <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-blue-600/20 border border-blue-500/30 rounded-xl text-blue-400">
          <i data-lucide="folder-kanban" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white flex items-center gap-2">
            Schul-Dashboard <span class="text-xs bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full font-medium">8 Fächer</span>
          </h1>
          <p class="text-xs text-slate-400">Synchronisiert auf Handy & PC via Cloud</p>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN GRID -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="subjects-grid">
      <!-- Fächer werden automatisch geladen -->
    </div>
  </main>

  <script>
    // hier trägst du einfach deine Links zu Google Drive / OneDrive Ordnern ein:
    const faecher = [
      { id: 'deutsch', name: 'Deutsch', link: 'https://drive.google.com/drive/folders/1Oo8HuIqBHACLarrfdeok2FXX23zu2tj3?usp=drive_link', border: 'hover:border-rose-500/50', badge: 'bg-rose-500/10 text-rose-400 border-rose-500/20', icon: 'book-open' },
      { id: 'kunst', name: 'Kunst', link: 'https://drive.google.com/drive/folders/1bKqClqbh9FaPM8RltgE4izm2xJyfx9_Z?usp=drive_link', border: 'hover:border-amber-500/50', badge: 'bg-amber-500/10 text-amber-400 border-amber-500/20', icon: 'palette' },
      { id: 'geschichte', name: 'Geschichte', link: 'https://drive.google.com/drive/folders/1Wr71s5vEUPjGyAkT3mwiPAMTaeE93zhz?usp=drive_link', border: 'hover:border-yellow-500/50', badge: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20', icon: 'landmark' },
      { id: 'geo', name: 'Geographie', link: 'https://drive.google.com/drive/folders/1Pjwd5FTcGbGpRlS5svXx38lZFqxSV7Bc?usp=drive_link', border: 'hover:border-emerald-500/50', badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', icon: 'globe' },
      { id: 'englisch', name: 'Englisch', link: 'https://drive.google.com/drive/folders/1zgbUwHG4OqMVDl5-13I-s_X3WfEntMEx?usp=drive_link', border: 'hover:border-cyan-500/50', badge: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20', icon: 'languages' },
      { id: 'mathe', name: 'Mathematik', link: 'https://drive.google.com/drive/folders/1790ce5q1euYX21cjFtBj04BwSuKdukes?usp=drive_link', border: 'hover:border-blue-500/50', badge: 'bg-blue-500/10 text-blue-400 border-blue-500/20', icon: 'calculator' },
      { id: 'sport', name: 'Sport', link: 'https://drive.google.com/drive/folders/1lZ61oNY2nHCvMNiUp0agAtPGNz32eVnT?usp=drive_link', border: 'hover:border-purple-500/50', badge: 'bg-purple-500/10 text-purple-400 border-purple-500/20', icon: 'activity' },
      { id: 'gk', name: 'Gemeinschaftskunde', link: 'https://drive.google.com/drive/folders/14zi5r4o7yDkF4kIGbXAz6knROBPbSL2D?usp=drive_link', border: 'hover:border-fuchsia-500/50', badge: 'bg-fuchsia-500/10 text-fuchsia-400 border-fuchsia-500/20', icon: 'newspaper' }
    ];

    function initDashboard() {
      const grid = document.getElementById('subjects-grid');
      grid.innerHTML = '';

      faecher.forEach(fach => {
        const card = document.createElement('div');
        card.className = `glass-card rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 ${fach.border}`;
        
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-2.5">
                <div class="p-2 bg-slate-800/80 rounded-lg text-slate-200 border border-slate-700/50">
                  <i data-lucide="${fach.icon}" class="w-5 h-5"></i>
                </div>
                <h2 class="font-semibold text-lg text-white">${fach.name}</h2>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${fach.badge}">Cloud</span>
            </div>

            <p class="text-xs text-slate-400 mb-6">Öffne den Ordner, um Dateien anzusehen oder auf Handy & PC hochzuladen.</p>

            <a href="${fach.link}" target="_blank" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20">
              <i data-lucide="external-link" class="w-4 h-4"></i> Ordner öffnen
            </a>
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    initDashboard();
  </script>
</body>
</html>
